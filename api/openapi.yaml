            $ref: '#/components/schemas/FrameType'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Before'
      responses:
        '200':
          description: Frame entries (newest first)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/MessageEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InsufficientRole'
  /settings:
    get:
      tags: [Config]
      operationId: getSettings
      summary: The settings the UI can change, with their sources
      description: |
        Each setting's effective value and where it came from: `ui` (set
        through this API; stored in the database; wins), `config` (the
        config file) or `default` (built in). `battery.capacity_wh` is
        null while unknown (no built-in default). The notification targets
        `notify.webhook_url` / `notify.ntfy_url` are secrets: null when
        off, the URL for an installer, the string `(set)` for anyone else.
      x-required-role: read-only
      responses:
        '200':
          description: The settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InsufficientRole'
        '503':
          description: The server runs without stored settings (tools, tests).
    put:
      tags: [Config]
      operationId: setSettings
      summary: Change settings
      description: |
        A partial map of setting key → value; `null` resets a key to the
        config file's (or the built-in) value. Every value is checked
        before any is stored; each change is audited (kind `setting`).
        `forward.mode` is refused here — use `PUT /forward-mode`, which
        applies it to the cloud connection at once (it is persisted the
        same way). Values: `battery.capacity_wh` an integer 1–200000 (Wh);
        `access.public_read_only` and `access.public_all_pages` booleans;
        `notify.webhook_url` / `notify.ntfy_url` an http(s) URL, or `""`
        to turn the target off (over a config-file value). A notification
        URL is never written to the audit log (it records `(set)` /
        `(off)`).

        The tuning knobs need only an **expert** token; every other key
        needs an installer, and one such key in an expert's body refuses
        the whole request (`403`, nothing stored):
        - `store.write_delay_s` (0–900, default 60): how long new records
          may wait in memory before they are written. Fewer, larger
          writes wear an SD card or eMMC far less; a power cut loses what
          waits. Commands and setting changes are always written at once.
          Applies immediately.
        - `alerts.soc_threshold_pct` (0–95, default 20; 0 = off),
          `alerts.soc_horizon_min` (10–1440, default 120),
          `alerts.soc_p_value` (0.001–0.5, default 0.05),
          `alerts.soc_window_min` (5–240, default 30): the battery alerts
          (`battery-low` when the charge is at or below the threshold;
          `battery-forecast-low` when a line fitted to the last window of
          readings says, with confidence 1 − p, that it will be there
          within the horizon).

        `site.time_zone` (installer): the site's IANA zone (e.g.
        `Australia/Melbourne`), the zone of the inverter's clock and
        schedule. Unset until chosen; the host's zone is never assumed.
        When the inverter's clock disagrees with the chosen zone by more
        than drift (5 min) or a missed daylight-saving change, the request
        is refused with `409 zone_mismatch` (nothing stored) unless it
        carries `?confirm=zone` — then `POST /clock/set` sets the
        inverter's clock to it.
      x-required-role: expert
      parameters:
        - name: confirm
          in: query
          required: false
          schema: { type: string, enum: [zone] }
          description: Store a `site.time_zone` the inverter's clock disagrees with.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                battery.capacity_wh: { type: [integer, 'null'], minimum: 1, maximum: 200000 }
                access.public_read_only: { type: [boolean, 'null'] }
                access.public_all_pages: { type: [boolean, 'null'] }
                notify.webhook_url: { type: [string, 'null'], maxLength: 2048 }
                notify.ntfy_url: { type: [string, 'null'], maxLength: 2048 }
                store.write_delay_s: { type: [integer, 'null'], minimum: 0, maximum: 900 }
                alerts.soc_threshold_pct: { type: [integer, 'null'], minimum: 0, maximum: 95 }
                alerts.soc_horizon_min: { type: [integer, 'null'], minimum: 10, maximum: 1440 }
                alerts.soc_p_value: { type: [number, 'null'], minimum: 0.001, maximum: 0.5 }
                alerts.soc_window_min: { type: [integer, 'null'], minimum: 5, maximum: 240 }
                update.check_interval_h: { type: [integer, 'null'], minimum: 0, maximum: 720 }
                update.prerelease: { type: [boolean, 'null'] }
                update.auto_apply: { type: [boolean, 'null'] }
                site.time_zone: { type: [string, 'null'], description: "An IANA zone name (Area/City)." }
                quirks.eps_dropouts: { type: [boolean, 'null'], description: "Expert. See GET /quirks." }
              additionalProperties: false
      responses:
        '200':
          description: The settings after the change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '400':
          $ref: '#/components/responses/InvalidValue'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InsufficientRole'
        '409':
          description: >-
            The chosen `site.time_zone` disagrees with the inverter's clock
            (`zone_mismatch`; the detail gives both times). Nothing stored.
        '503':
          description: The server runs without stored settings (tools, tests).
  /openapi.yaml:
    get:
      tags: [Config]
      operationId: getSpec
      summary: This document
      description: The API's contract as built into the running version (YAML). Open — it describes the API and holds no data.
      security: []
      responses:
        '200':
          description: The OpenAPI document
          content:
            application/yaml:
              schema: { type: string }
  /quirks:
    get:
      tags: [Config]
      operationId: getQuirks
      summary: Known inverter quirks and whether each is on
      description: |
        Inverter behaviours seen in the field that the app can compensate
        for, each with what turning it on changes, where it was seen, its
        default and its effective state. A quirk only changes how values
        are shown; stored history, the API and exports stay as the
        inverter reports them. Change one with `PUT /settings`
        (`quirks.<id>`, expert role) or `[quirks]` in the config file.
      x-required-role: read-only
      responses:
        '200':
          description: The quirks
          content:
            application/json:
              schema:
                type: object
                required: [quirks]
                properties:
                  quirks:
                    type: array
                    items:
                      type: object
                      required: [id, title, effect, seen, default, enabled, source]
                      properties:
                        id: { type: string, examples: [eps_dropouts] }
                        title: { type: string }
                        effect: { type: string, description: What turning it on changes. }
                        seen: { type: string, description: Where it has been observed. }
                        default: { type: boolean }
                        enabled: { type: boolean }
                        source: { type: string, enum: [default, config, ui] }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /update:
    get:
      tags: [Config]
      operationId: getUpdate
      summary: Release and self-upgrade status
      description: |
        The running version, the newest release from the daily check (when
        enabled: `[update] check`), whether it can be applied here, and an
        upgrade in flight (`pending`) or rolled back by the guard
        (`rolled_back`, until dismissed). Releases are signed offline and
        verified against the key built into the running binary (D-023).
      x-required-role: read-only
      responses:
        '200':
          description: The status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpdateView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /update/check:
    post:
      tags: [Config]
      operationId: checkUpdate
      summary: Check for a release now
      description: One request to the release feed (carrying only the version); returns the status as GET /update.
      x-required-role: installer
      responses:
        '200':
          description: The status after the check
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpdateView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientRole' }
  /update/apply:
    post:
      tags: [Config]
      operationId: applyUpdate
      summary: Install the latest release and restart
      description: |
        Downloads the latest release, verifies its signature and checksum,
        self-tests it, swaps it in atomically (the old binary kept) and
        restarts into it after the response. The new version must bring
        the inverter back with fresh readings before it is trusted; the
        guard rolls back a version that fails to (D-023).
      x-required-role: installer
      responses:
        '202':
          description: Installed; the service restarts into it
          content:
            application/json:
              schema:
                type: object
                required: [restarting, from, to]
                properties:
                  restarting: { type: boolean }
                  from: { type: string, description: The version replaced. }
                  to: { type: string, description: The version installed. }
        '409':
          description: Not possible here (`update_not_possible` — container, no self-upgrade, …) or already current (`update_not_available`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '502':
          description: The download failed (`update_failed`) or did not verify (`update_verification_failed` — signature, checksum or self-test)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '507':
          description: Not enough free disk space for the new binary (`insufficient_space`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientRole' }
  /update/rolled-back:
    delete:
      tags: [Config]
      operationId: dismissRollback
      summary: Dismiss the rollback notice
      x-required-role: installer
      responses:
        '204': { description: Dismissed (also when there was none) }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientRole' }
  /notify/test:
    post:
      tags: [Config]
      operationId: testNotify
      summary: Send a test notification
      description: |
        One test notice to every configured target now (no queue, no
        retry), with each target's outcome. Notifications (F2) go out on
        their own for: the inverter offline for 10 minutes and back
        online, the grid lost (also when already down at start-up) and
        back, gate rule loss, upgrade rolled back (critical; "back
        online" and "grid back" are info); alerts
        (failed commands and schedules, a write refused by the hourly
        budget, low disk), maintenance-window and forward-mode changes
        (warning; ntfy priority high). "Back online" is info (ntfy
        default). The webhook receives JSON `{source, event, severity,
        title, message, ts}`; ntfy a text body with `Title`, `Priority`
        and `Tags` headers. A repeat of the same notice within 15 minutes
        is suppressed. Notices wait in a database outbox until every target
        has them (retried with backoff, from 30 s up to 15 min, for about a
        day), so they survive a restart; one delivered late says when it
        happened. An unexpected stop (no clean shutdown, e.g. a power cut)
        is announced at the next start (`unclean-restart`, warning).
      x-required-role: installer
      responses:
        '200':
          description: Each target's outcome
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      required: [target]
                      properties:
                        target: { type: string, enum: [webhook, ntfy] }
                        error: { type: string, description: 'Absent on success. Never contains the URL.' }
        '409':
          description: No target configured (`notify_not_configured`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InsufficientRole'
  /setup:
    get:
      tags: [Config]
      operationId: getSetup
      summary: The first-run checklist
      description: |
        What the setup wizard shows: whether setup was completed, and a
        checklist (`inverter_connected`, `identified`, `verified`,
        `clock`, `battery_capacity`), each `ok`, `warn`, `fail` or
        `pending` with a human-readable `detail` and, when not ok, a
        `fix`. `battery.modules` is the module count from the inverter's
        battery snapshot, to suggest a capacity (modules × kWh per module).
      x-required-role: installer
      responses:
        '200':
          description: The checklist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Setup'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InsufficientRole'
  /setup/complete:
    post:
      tags: [Config]
      operationId: completeSetup
      summary: Record that the setup wizard was finished
      x-required-role: installer
      responses:
        '204':
          description: Recorded (audited)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InsufficientRole'
  /clock/set:
    post:
      tags: [Commands]
      operationId: setInverterClock
      summary: Set the inverter's clock to the site's time
      description: |
        The inverter keeps a bare wall clock (40000 ×6: year, month, day,
        hour, minute, second; no time zone). This writes the site zone's
        wall time now (`site.time_zone`, `PUT /settings`), from this
        machine's clock, as one fn10 write — the FoxESS cloud's own clock
        write, echoed by the inverter (protocol profile §5). foxess-local
        also corrects drift (up to 5 min) and a missed daylight-saving
        change by itself; this is for anything larger, after the owner
        has confirmed the zone. Never queued: with no inverter session it
        is refused. Write gate (C-008) and write budget as for every
        write (`clock`).
      x-required-role: installer
      responses:
        '429':
          $ref: '#/components/responses/TooManyWrites'
        '200':
          description: The clock was set (confirmed by the inverter's echo)
          content:
            application/json:
              schema:
                type: object
                required: [set_to, time_zone]
                properties:
                  set_to: { type: string, description: 'The wall time written, 2006-01-02T15:04:05 (site zone).' }
                  time_zone: { type: string }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InsufficientRole'
        '409':
          description: >-
            No site time zone yet (`zone_unset`); this machine's clock is not
            synchronised (`host_clock_unsynced`); or a command is in flight
            (`command_in_flight`).
        '501':
          $ref: '#/components/responses/WriteUnsupported'
        '503':
          $ref: '#/components/responses/InverterOffline'
        '504':
          $ref: '#/components/responses/CommandFailed'
  /maintenance:
    get:
      tags: [Maintenance]
      operationId: getMaintenance
      summary: Maintenance window state
      description: |
        The window is process-local: it does not survive a restart.
        While active, the cloud channel is an unfettered bidirectional
        pass-through over whatever forward mode is configured.
      x-required-role: read-only
      responses:
        '200':
          description: Window state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceState'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InsufficientRole'
    post:
      tags: [Maintenance]
      operationId: openMaintenance
      summary: Open (or re-arm) the maintenance window
      description: |
        Opens a time-boxed window of unfettered bidirectional comms — the
        cloud may do anything in that direction, including firmware pushes.
        Default 30 min; `duration` (e.g. "45m") is capped at 4 h per call
        (over the cap → `400`). While the window is active a `POST`
        re-arms the deadline instead of opening again.
      x-required-role: installer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                duration:
                  type: string
                  description: 'Go duration string, e.g. "30m" or "2h"; absent/empty uses the 30 min default.'
                capture:
                  type: boolean
                  default: false
                  description: >-
                    Record the window's traffic, both directions, byte-exact as
                    received (before any parsing or policy), so a firmware
                    update installed in the window is kept in full. Listed under
                    /captures, kept until deleted; recording stops at the size
                    cap (`retention.capture_max_mb`, default 256).
      responses:
        '200':
          description: Window state (opened or re-armed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceState'
        '400':
          description: 'Invalid duration (unparseable or over the 4 h cap) — `code: invalid_value`, field `duration`'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InsufficientRole'
    delete:
      tags: [Maintenance]
      operationId: closeMaintenance
      summary: Close the maintenance window
      description: The configured forward mode is back in force immediately.
      x-required-role: installer
      responses:
        '200':
          description: Window state (closed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceState'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InsufficientRole'
        '409':
          description: 'The window is not active (`code: maintenance_not_active`)' 
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /captures:
    get:
      tags: [Maintenance]
      operationId: listCaptures
      summary: Maintenance-window captures, newest first
      x-required-role: installer
      responses:
        '200':
          description: The captures
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/CaptureInfo'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InsufficientRole'
  /captures/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, pattern: '^[0-9]{8}T[0-9]{6}Z$'}
    get:
      tags: [Maintenance]
      operationId: getCapture
      summary: Download one capture (.tar.gz)
      description: |
        The window's files, byte-exact and not de-identified (they hold the
        inverter's serials — keep the archive private): window.json, and per
        connection c2s.bin (inverter → cloud), s2c.bin (cloud → inverter)
        and meta.jsonl, in prox's capture layout (tools/mon150 reads it).
        Audited.
      x-required-role: installer
      responses:
        '200':
          description: The archive.
          content:
            application/gzip:
              schema: {type: string, format: binary}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InsufficientRole'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Maintenance]
      operationId: deleteCapture
      summary: Delete one capture
      description: Audited. `409` while it is still recording.
      x-required-role: installer
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InsufficientRole'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Still recording
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /config:
    get:
      tags: [Config]
      operationId: getConfig
      summary: Read-only server configuration view
      x-required-role: read-only
      responses:
        '200':
          description: Configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Config'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InsufficientRole'
  /config/tokens:
    get:
      tags: [Config]
      operationId: listTokens
      summary: List API tokens
      x-required-role: installer
      responses:
        '200':
          description: Tokens (no secrets)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/TokenInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InsufficientRole'
    post:
      tags: [Config]
      operationId: createToken
      summary: Create a token
      description: The plaintext token is returned exactly once.
      x-required-role: installer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenCreate'
      responses:
        '201':
          description: Token created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenCreated'
        '400':
          $ref: '#/components/responses/InvalidValue'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InsufficientRole'
  /config/tokens/{id}:
    delete:
      tags: [Config]
      operationId: revokeToken
      summary: Revoke a token
      x-required-role: installer
      parameters:
        - $ref: '#/components/parameters/TokenId'
      responses:
        '204':
          description: Revoked
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InsufficientRole'
        '404':
          $ref: '#/components/responses/NotFound'
  /events:
    get:
      tags: [Events]
      operationId: streamEvents
      summary: Server-Sent Events stream
      description: |
        `text/event-stream`. Event types and payloads:

        | event | payload |
        |---|---|
        | `snapshot` | `SnapshotEvent` — the live values, every reading (~5 s); no `id` |
        | `config` | `ConfigEvent` — any confirmed register change (ours or a cloud push) |
        | `connection` | `ConnectionEvent` — inverter liveness up/down (session down, or data-silent >15 s — server-computed) |
        | `system` | `SystemEvent` — forward-mode change, maintenance window transitions, alerts |
        | `resync` | `ResyncEvent` — replay window exceeded; do `GET /state` |
        | `gap` | `GapEvent` — per-client drops; do `GET /state` |

        `id` is monotonic per connection epoch; send it back as
        `Last-Event-ID` for replay. The replay window is the last 1024
        discrete events (`config`, `connection`, `system`). Snapshots are
        not replayed — each only says what the values are now, and the
        next supersedes it — and carry no `id`, so the client's
        Last-Event-ID stays on the last discrete event. Every connection
        (fresh or resumed) sends the latest snapshot after its replay, so
        the current values arrive at once. A client that falls behind
        drops snapshots silently; `gap` reports dropped discrete events
        only. The 5 s snapshot cadence is the heartbeat: treat >15 s of
        silence as offline. Browsers' `EventSource`
        passes the bearer token as `?token=` (LAN-only v1).
      x-required-role: read-only
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: integer
        - name: token
          in: query
          required: false
          description: Bearer token for EventSource clients (cannot set headers). Prefer the Authorization header.
          schema:
            type: string
      responses:
        '200':
          description: Event stream
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/Event'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InsufficientRole'
        '503':
          description: >-
            The concurrent-stream limit is reached (code too_many_streams;
            Retry-After set).
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /notices:
    get:
      tags: [Events]
      operationId: listNotices
      summary: Recent notices (foxess-local's and automations')
      description: >-
        Every notice that was news (not a repeat within the 15-minute
        dedup window), whether or not a webhook or ntfy target is set:
        foxess-local's own (`origin` foxess-local) and automations' (D-030).
        Newest first; kept 30 days, at most 500. `before` (an id) pages back.
      x-required-role: read-only
      parameters:
        - name: before
          in: query
          required: false
          schema: {type: integer, minimum: 1}
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
      responses:
        '200':
          description: The notices
          content:
            application/json:
              schema:
                type: object
                required: [notices]
                properties:
                  notices:
                    type: array
                    items:
                      $ref: '#/components/schemas/Notice'
        '400':
          $ref: '#/components/responses/InvalidValue'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InsufficientRole'
    post:
      tags: [Events]
      operationId: sendNotice
      summary: Send a notice from an automation
      description: |
        For automations (D-030): a notice delivered like foxess-local's own
        — the outbox (survives a restart, retried), the webhook and ntfy
        targets, the 15-minute dedup of the same event and message — and
        kept in `GET /notices`. Its origin is the token's name: the
        webhook body carries `origin`, ntfy's title is prefixed with it.
        The event is prefixed `sidecar.` so it never passes for one of
        foxess-local's own. `critical` needs an expert or installer token.
        At most 20 an hour per token (`429 notice_rate`, Retry-After).
      x-required-role: standard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoticeRequest'
      responses:
        '202':
          description: Accepted (a repeat within the dedup window is dropped)
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted: {type: boolean}
        '400':
          $ref: '#/components/responses/InvalidValue'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InsufficientRole'
        '429':
          description: 'The token''s hourly budget is spent (`code: notice_rate`; Retry-After set)'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: 'No notifier in this server (`code: notices_unavailable`)'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /healthz:
    get:
      tags: [Config]
      operationId: health
      summary: Liveness
      description: Unauthenticated; no secret data (container healthcheck).
      security: []
      responses:
        '200':
          description: Alive
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
  /readyz:
    get:
      tags: [Config]
      operationId: ready
      summary: Readiness
      description: |
        Whether the service is doing its job, unlike `/healthz` (the
        process answers). Checks: the inverter listener is bound, the
        inverter is connected with fresh readings, every database write
        has landed, disk space, and the inverter's clock. **503** while
        any check fails; 200 with `status: degraded` on a warning.
        Unauthenticated for monitors: without a token each check carries
        its id, title and status only; any valid token adds `detail` and
        `fix`. Also at `/api/v1/readyz`. `foxess-local doctor` prints it.
      security: []
      responses:
        '200':
          description: Ready or degraded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }
        '503':
          description: Not ready (a check fails)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }
  /metrics:
    get:
      tags: [Config]
      operationId: metrics
      summary: Prometheus metrics
      description: |
        The Prometheus text format (0.0.4): `foxess_ready`,
        `foxess_check_status{check}` (0 ok, 1 pending, 2 warning, 3
        failing), `foxess_inverter_online`, `foxess_data_age_seconds`,
        `foxess_power_watts{flow}` (pv, grid, load, battery, ac_port, eps;
        same signs as `State.power`), `foxess_battery_soc_percent`,
        `foxess_battery_stored_energy_wh`, `foxess_bms_charge_limit_amperes`,
        `foxess_temperature_celsius{sensor}` (battery, inverter, ambient,
        cell_min, cell_max), `foxess_forward_mode{mode}`,
        `foxess_maintenance_window_active` and `foxess_build_info{version}`.
        A value with no reading yet is omitted, never reported as 0. Read
        like the dashboard: a token, or none while public read-only access
        is on. Also at `/api/v1/metrics`.
      x-required-role: read-only
      responses:
        '200':
          description: Metrics
          content:
            text/plain:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Named token with a role (read-only < standard < expert < installer). See `x-required-role` per operation.
  parameters:
    From:
      name: from
      in: query
      required: false
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      required: false
      schema:
        type: string
        format: date-time
    Before:
      name: before
      in: query
      required: false
      description: Exclusive upper time bound (RFC 3339); cursor for the next older page.
      schema:
        type: string
        format: date-time
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100
    TokenId:
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    TooManyWrites:
      description: >-
        The setting's write budget is spent (`write_budget`): at most
        `limit` real writes per setting per rolling hour (`[writes]`
        per_hour, default 10, with per-setting overrides). The Problem
        names the `setting`, has `remaining: 0` and `next_free_at`; the
        `Retry-After` header gives the seconds until then. What counts is
        described under `WriteBudget`.
      headers:
        Retry-After:
          description: Seconds until the next write to this setting is allowed.
          schema: {type: integer, minimum: 1}
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    WriteUnsupported:
      description: >-
        The write is impossible on this inverter (`write_unsupported`;
        `reason` unmapped or not_supported).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: 'Missing or invalid token (`code: unauthorized`)'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InsufficientRole:
      description: 'Token role below the operation''s requirement (`code: insufficient_role`; carries `required_role`, `token_role`)'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InvalidValue:
      description: >-
        Validation failure (`code: invalid_value` with `errors[]`, or `code:
        schedule_overlap`). Request bodies are strict: a field the operation
        does not define, or data after the JSON value, is an invalid_value —
        nothing in the request is applied (a misspelt field is never dropped
        silently).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: 'Unknown resource (`code: not_found`)'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    CommandInFlight:
      description: 'One command in flight at a time (`code: command_in_flight`)'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InverterOffline:
      description: 'No inverter data within 15 s — session down or established-but-silent (`code: inverter_offline`)'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    CommandFailed:
      description: 'No device read-back within timeout (`code: command_failed`; carries `applied`)'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Internal:
      description: 'Internal error (`code: internal`)'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Role:
      type: string
      enum: [read-only, standard, expert, installer]
    State:
      type: object
      required: [ts, online, power, battery, work_mode, meter_compensation_w, limits, schedule, forward_mode, identity, energy, write_budget]
      properties:
        ts:
          type: string
          format: date-time
          description: When this snapshot was built.
        energy:
          $ref: '#/components/schemas/Energy'
        schedule_override:
          oneOf:
            - $ref: '#/components/schemas/ScheduleOverride'
            - type: 'null'
          description: The active schedule override (`PUT /schedule/override`); null when none.
        write_budget:
          type: object
          description: >-
            Each budgeted setting's write budget, keyed by the
            `identity.writes` feature names (work_mode, schedule,
            power_limits, current_limits, meter_compensation,
            battery_currents, power_limit, port_limits, eps_mode). A setting
            that is not listed is unbudgeted.
          additionalProperties:
            $ref: '#/components/schemas/WriteBudget'
        as_of:
          type: [string, 'null']
          format: date-time
          description: >-
            Timestamp of the newest frame reflected in this snapshot; null
            until the first inverter frame. With online=false this
            distinguishes never-seen (null) from was-seeing-it-then-stopped
            (stale timestamp) — the two shapes the web UI renders
            differently.
        online:
          type: boolean
          description: >-
            Server-computed liveness: true only if inverter data (the 5 s
            telemetry cadence, never the ~293 s snapshot bursts) was received
            within the last 15 s. False for a down session AND for an
            established-but-silent one (zombie) — the unambiguous staleness
            indicator; clients must not recompute it from as_of (clock skew).
        power:
          $ref: '#/components/schemas/Power'
        battery:
          $ref: '#/components/schemas/Battery'
        work_mode:
          $ref: '#/components/schemas/WorkMode'
        active_mode:
          type: [object, 'null']
          required: [mode, source]
          description: >-
            What runs now. With the scheduler on, the first enabled group (by
            index) whose window holds the time (end exclusive); otherwise the
            base work_mode. Precedence and end handling are inferred from the
            inverter's behaviour, not documented. The time is the inverter's
            own wall clock (a reading under 15 min old), else the site zone's;
            null while neither is known.
          properties:
            mode: {type: string, description: "a ScheduleGroup work mode"}
            source: {type: string, enum: [schedule, base]}
            group: {type: integer, description: "the deciding group (source schedule)"}
            start: {type: string}
            end: {type: string}
        eps_mode:
          type: string
          enum: [ups, eps, disabled, '']
          description: EPS (backup) port output setting (41015; '' = unknown).
        meter_compensation_w:
          type: integer
          format: int32
          minimum: -500
          maximum: 500
          description: Signed watts (register 41029).
        limits:
          $ref: '#/components/schemas/Limits'
        schedule:
          $ref: '#/components/schemas/Schedule'
        forward_mode:
          $ref: '#/components/schemas/ForwardMode'
        identity:
          $ref: '#/components/schemas/Identity'
        temperatures:
          $ref: '#/components/schemas/Temperatures'
        inverter_state:
          type: string
          enum: [self-test, waiting, checking, on-grid, off-grid, recoverable-fault, unrecoverable-fault, unknown]
          description: >-
            The inverter's state register (31027; foxess_modbus's names).
            off-grid: the grid is down and the backup (EPS) circuits run on the
            battery. unknown until the first live reading.
        grid_connected:
          type: [boolean, 'null']
          description: true on grid, false off grid (a grid outage), null in any other state or before a reading.
    Readiness:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ready, degraded, not_ready]
        checks:
          type: array
          items:
            type: object
            required: [id, title, status]
            properties:
              id: { type: string, description: 'listener, disk, inverter_connected, store, clock' }
              title: { type: string }
              status: { type: string, enum: [ok, pending, warn, fail] }
              detail: { type: string, description: With a token only. }
              fix: { type: string, description: With a token only, when not ok. }
    Temperatures:
      type: object
      description: >-
        Live temperatures, °C; null when not reported. battery_c, inverter_c
        and ambient_c are the inverter's own readings (registers 31023,
        31018, 31019) with each 5 s sample. cell_min_c / cell_max_c are the
        BMS's coldest and warmest cell (the battery snapshot, about every 5
        minutes; null once it is over 15 minutes old). The coldest cell is
        the FoxESS portal's "BMS battery temperature": the BMS sets the
        charge limit (battery.bms_charge_limit_a) from it and the SoC.
      properties:
        battery_c: { type: [number, 'null'] }
        inverter_c: { type: [number, 'null'] }
        ambient_c: { type: [number, 'null'] }
        cell_min_c: { type: [number, 'null'] }
        cell_max_c: { type: [number, 'null'] }
    Identity:
      type: object
      description: >-
        Who the inverter says it is (design D-020). The serial number comes
        from the device-info snapshot the inverter sends unprompted. Model
        and firmware come from the model / version registers (30000 ×15,
        30016-30018, read with the settings every 5 min) when the inverter
        answers them, else from the snapshot. Empty strings until observed.
      required: [sn, model, firmware, verified_profile, compatibility, writes]
      properties:
        sn:
          type: string
        model:
          type: string
          examples: [KH10]
        firmware:
          type: object
          required: [master, slave, manager]
          properties:
            master: {type: string, examples: ['1.73']}
            slave: {type: string, examples: ['1.03']}
            manager: {type: string, examples: ['1.71']}
        writes:
          type: object
          description: >-
            Write feature → support on this device's layout: verified,
            untested (an installer grant can enable it), unmapped or
            not_supported (impossible). Unmapped until a layout is established.
            Features: work_mode, power_limits, meter_compensation, schedule,
            current_limits, battery_currents, power_limit, port_limits,
            eps_mode (the last five: PUT /current-limits, /battery-currents,
            /power-limit, /port-limits, /eps-mode).
          additionalProperties:
            type: string
            enum: [verified, untested, unmapped, not_supported]
        compatibility:
          type: object
          description: Feature name → confidence level (details at GET /compatibility).
          additionalProperties:
            $ref: '#/components/schemas/ConfidenceLevel'
        verified_profile:
          type: [string, 'null']
          description: >-
            The verified profile this device matches exactly (model and all
            three firmware versions), e.g. `kh10-fw1.73`; null for any other
            model or firmware. Only a verified profile's register meanings
            are proven by captured cloud writes.
    WriteOverride:
      type: object
      required: [granted, device, grant]
      properties:
        granted:
          type: boolean
          description: The grant exists and covers the current device.
        device:
          type: object
          properties:
            model: {type: string}
            firmware:
              type: object
              properties:
                master: {type: string}
                slave: {type: string}
                manager: {type: string}
        grant:
          type: [object, 'null']
          description: The persisted grant (it may cover another firmware than the current one).
          properties:
            model: {type: string}
            firmware: {type: object}
            by: {type: string}
            at: {type: string, format: date-time}
    ConfidenceLevel:
      type: string
      enum: [exact, compatible, pending, unknown]
    Energy:
      type: object
      description: >-
        The inverter's lifetime energy counters, in kWh with 0.1 kWh
        resolution, read every 30 s (KH: the 32000 register block). Each
        counter is monotonic: a lower reading is held until the next read
        confirms it, then reported as the new value with a `counter-reset`
        system event naming the field (re-baseline; do not book a negative
        delta). A field is null until its first read, and null when this
        inverter model does not report it.
      required: [grid_export_kwh, grid_import_kwh, pv_kwh, battery_charge_kwh, battery_discharge_kwh, load_kwh, output_kwh, as_of, sources]
      properties:
        grid_export_kwh: {type: [number, 'null'], description: Energy exported to the grid (feed-in).}
        grid_import_kwh: {type: [number, 'null'], description: Energy imported from the grid.}
        pv_kwh: {type: [number, 'null'], description: Photovoltaic yield.}
        battery_charge_kwh: {type: [number, 'null'], description: Energy into the battery.}
        battery_discharge_kwh: {type: [number, 'null'], description: Energy out of the battery.}
        load_kwh: {type: [number, 'null'], description: Household consumption.}
        output_kwh: {type: [number, 'null'], description: The inverter's AC output (its "yield" total).}
        as_of:
          type: [string, 'null']
          format: date-time
          description: When the counters were last read; null before the first read.
        sources:
          type: object
          description: >-
            Where each reported field comes from: `register` (the
            inverter's own lifetime total; survives gateway restarts and
            matches the FoxESS app) or `integrated` (power integrated here).
          additionalProperties:
            type: string
            enum: [register, integrated]
    WriteBudget:
      type: object
      description: >-
        One setting's write budget now: at most `limit` real writes per
        rolling `window_s`. What counts: a write that reached the inverter
        counts one — a whole `PUT /schedule` is one schedule write however
        many groups changed, and a write whose read-back timed out (504,
        `applied: unknown`) counts one. A write the inverter already holds
        (not sent) and a write refused before sending count zero. Each
        counted write's config event carries the updated budget (section
        `write-budget` when nothing else changed).
      required: [limit, remaining, window_s, next_free_at]
      properties:
        limit: {type: integer, description: "The configured cap ([writes] per_hour or per_setting)."}
        remaining: {type: integer, minimum: 0}
        window_s: {type: integer, examples: [3600]}
        next_free_at:
          type: [string, 'null']
          format: date-time
          description: When the oldest counted write leaves the window (remaining goes up by one); null while remaining == limit.
    CompatibilityReport:
      type: object
      required: [family, features]
      properties:
        verified_profile:
          type: string
          description: Present when the device matches a verified profile exactly.
        family:
          type: string
          description: Recognised model family and register layout; empty when unrecognised.
        layout:
          type: string
          description: The register layout established from the registers that answer (the driver key); empty when not established.
        third_party:
          type: object
          description: The foxess_modbus map behind the layout (a tentative source) and where it disagrees with the verified profile.
          properties:
            source: {type: string}
            commit: {type: string}
            map: {type: string}
            divergences: {type: array, items: {type: object}}
        features:
          type: array
          items:
            type: object
            required: [name, level, reason, checks]
            properties:
              name: {type: string, examples: [power_limits]}
              level: {$ref: '#/components/schemas/ConfidenceLevel'}
              reason: {type: string}
              checks:
                type: array
                items:
                  type: object
                  required: [name, status]
                  properties:
                    name: {type: string, examples: [pv_power_product]}
                    status: {type: string, enum: [pass, fail, pending, skip]}
                    detail: {type: string}
    Power:
      type: object
      description: '150 B telemetry frame (5 s cadence). Sign conventions per field; identities: grid = load + battery - pv, ac_port = pv - battery.'
      required: [pv_w, grid_w, load_w, ac_port_w, battery_w]
      properties:
        pv_w:
          type: integer
          format: int32
          description: PV generation, positive.
        grid_w:
          type: integer
          format: int32
          description: At the panel. Positive = import from grid, negative = export.
        load_w:
          type: integer
          format: int32
          description: Household load, positive.
        ac_port_w:
          type: integer
          format: int32
          description: Inverter AC port. Positive = output, negative = input.
        battery_w:
          type: integer
          format: int32
          description: Positive = charging, negative = discharging.
        eps_w:
          type: integer
          format: int32
          description: >-
            EPS (backup / UPS) port output, positive. 0 when the port is off
            or unloaded, and on telemetry that does not report it. Included
            in both ac_port_w and load_w (KH, verified 2026-11-17): the
            switchboard gets ac_port_w − eps_w, the main-board circuits
            draw load_w − eps_w.
    Battery:
      type: object
      required: [soc_pct, state]
      properties:
        soc_pct:
          type: integer
          minimum: 0
          maximum: 100
          description: The inverter's SoC, whole percent; 5 s cadence (150 B frame).
        soc_estimate_pct:
          type: [number, 'null']
          minimum: 0
          maximum: 100
          description: The SoC between the inverter's whole-percent readings, two decimals — the battery power integrated since the last reading, held within [soc_pct − 0.5, soc_pct + 0.494] (D-028), scaled by the measured energy per percent once known (measured_capacity). Null while the capacity is not set, and before the first reading of the current soc_pct.
        measured_capacity:
          oneOf:
            - $ref: '#/components/schemas/MeasuredCapacity'
            - type: 'null'
        state:
          $ref: '#/components/schemas/BatteryState'
        stored_energy_wh:
          type: [integer, 'null']
          description: Usable energy = SoC × capacity_wh (Wh), from soc_estimate_pct when there is one, else soc_pct. Null until the first SoC reading, and while the capacity is not set.
        capacity_wh:
          type: [integer, 'null']
          description: The pack's usable energy across SoC 0–100 % (the battery.capacity_wh setting — UI value, else config file). Null while not set (no built-in default).
        pack_voltage_v:
          type: [number, 'null']
          description: Snapshot-burst cadence; candidate 0.01 V scale (scale pending a concurrent Modbus read). Null until the first burst.
        bms_charge_limit_a:
          type: [number, 'null']
          description: The BMS's charge-current limit (register 31025), A — set by the battery from its coldest cell's temperature (temperatures.cell_min_c) and its SoC. Null until the first register reading.
    MeasuredCapacity:
      type: object
      description: The pack's capacity measured between SoC readings (D-028) — the energy the battery power shows between two consecutive single-step SoC changes in one direction, × 100. Below capacity_wh on a pack that has lost health; it includes the losses between the inverter's measurement and the cells, so charging and discharging differ. A direction's Wh is null until 3 clean intervals agree; soc_estimate_pct applies it from then on.
      required: [charging_wh, discharging_wh, charging_intervals, discharging_intervals]
      properties:
        charging_wh: { type: [integer, 'null'] }
        discharging_wh: { type: [integer, 'null'] }
        charging_intervals: { type: integer, minimum: 0, description: The clean intervals measured. }
        discharging_intervals: { type: integer, minimum: 0 }
    BatteryState:
      type: string
      enum: [charging, discharging, idle, unknown]
    WorkMode:
      type: string
      description: Immediate work mode (register 41000). Force charge / force discharge are scheduler windows.
      enum: [self-use, feed-in]
    ScheduleWorkMode:
      type: string
      description: Per-group work mode (wire enum 1..7).
      enum: [self-use, feed-in, backup, peak-shaving, power-station, force-charge, force-discharge]
    Limits:
      type: object
      required: [import_w, export_w]
      properties:
        import_w:
          type: integer
          format: int32
          minimum: 0
          maximum: 30000
          description: Registers 41021:41022 (U32, high word first).
        export_w:
          type: integer
          format: int32
          minimum: 0
          maximum: 30000
          description: Registers 41023:41024 (U32, high word first).
        import_current_a:
          type: [number, 'null']
          description: >-
            Grid import current limit, A (register 41027, 0.1 A). Read-only
            (not set by PUT /limits); `null` until the first settings read
            and in the PUT /limits read-back.
        export_current_a:
          type: [number, 'null']
          description: >-
            Grid export current limit, A (register 41028, 0.1 A). Read-only;
            `null` until the first settings read and in the PUT /limits
            read-back.
        load_limit_w:
          type: [integer, 'null']
          description: >-
            LoadLimitPower (41200): caps the inverter's draw at its grid port
            — battery charging plus EPS pass-through (measured 2026-11-17).
            Read-only.
        generation_limit_w:
          type: [integer, 'null']
          description: GenerationLimitPower (41201), presumably the grid-port output cap (untested). Read-only.
        max_charge_current_a:
          type: [number, 'null']
          description: Battery-side charge current limit (41007, 0.1 A). Read-only.
        max_discharge_current_a:
          type: [number, 'null']
          description: Battery-side discharge current limit (41008, 0.1 A). Read-only.
        power_limit_pct:
          type: [integer, 'null']
          description: Output power limit, % of rating (41016). Read-only.
    RegisterReadRequest:
      type: object
      required: [fn, addr, count]
      properties:
        fn: {type: integer, enum: [3, 4], description: 3 holding / 4 input}
        addr: {type: integer, minimum: 0, maximum: 65535}
        count: {type: integer, minimum: 1, maximum: 125}
    RegisterReadResponse:
      type: object
      required: [fn, addr, registers]
      properties:
        fn: {type: integer}
        addr: {type: integer}
        registers:
          type: array
          items:
            type: object
            required: [addr, value]
            properties:
              addr: {type: integer}
              value: {type: integer, minimum: 0, maximum: 65535, description: raw u16}
    LimitsUpdate:
      type: object
      description: At least one field required.
      properties:
        import_w:
          type: integer
          format: int32
          minimum: 0
          maximum: 30000
        export_w:
          type: integer
          format: int32
          minimum: 0
          maximum: 30000
    WorkModeRequest:
      type: object
      required: [work_mode]
      properties:
        work_mode:
          $ref: '#/components/schemas/WorkMode'
    MeterCompensationRequest:
      type: object
      required: [w]
      properties:
        w:
          type: integer
          format: int32
          minimum: -500
          maximum: 500
          description: Signed watts.
    ForwardMode:
      type: string
      enum: [off, telemetry_only, full]
    ForwardModeState:
      type: object
      required: [mode]
      properties:
        mode:
          $ref: '#/components/schemas/ForwardMode'
    NoticeRequest:
      type: object
      required: [event, severity, title]
      properties:
        event:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{0,39}$'
          description: The automation's event name (delivered as `sidecar.<event>`).
        severity:
          type: string
          enum: [info, warning, critical]
          description: ntfy priority 3 / 4 / 5. critical needs an expert or installer token.
        title:
          type: string
          minLength: 1
          maxLength: 120
          description: One line.
        message:
          type: string
          maxLength: 1000
    Notice:
      type: object
      required: [id, ts, origin, event, severity, title, message]
      properties:
        id: {type: integer}
        ts: {type: string, format: date-time}
        origin:
          type: string
          description: foxess-local, or the name of the automation's token.
        event: {type: string}
        severity:
          type: string
          enum: [info, warning, critical]
        title: {type: string}
        message: {type: string}
    ScheduleOverrideRequest:
      type: object
      required: [mode, until, fd_soc_pct, fd_pwr_w]
      properties:
        mode:
          type: string
          enum: [force-discharge, force-charge]
        until:
          type: string
          format: date-time
          description: >-
            When it ends: 1 minute to 12 hours ahead. Rounded up to the
            inverter's minute; a window cannot pass the inverter's
            midnight (it ends at 23:59; renew after midnight).
        fd_soc_pct:
          type: integer
          minimum: 10
          maximum: 100
          description: >-
            The cut-off SoC: a force discharge stops at it, a force charge
            charges to it. The inverter enforces it.
        fd_pwr_w:
          type: integer
          minimum: 0
          maximum: 10500
          description: The force window's power (W).
    ScheduleOverride:
      type: object
      required: [active]
      properties:
        active:
          type: boolean
        mode:
          type: string
          enum: [force-discharge, force-charge]
        holder:
          type: string
          description: The name of the token that holds it.
        group:
          type: integer
          minimum: 1
          maximum: 8
          description: The schedule group it occupies.
        start:
          type: string
          description: The window's start, HH:MM inverter time.
        end:
          type: string
          description: The window's end, HH:MM inverter time (exclusive).
        until:
          type: string
          format: date-time
          description: >-
            When it ends: the window's end. Earlier than requested_until
            when the window had to stop where another group's window
            begins, or at the inverter's midnight.
        requested_until:
          type: string
          format: date-time
        since:
          type: string
          format: date-time
          description: When it started (kept across renewals).
        fd_soc_pct:
          type: integer
        fd_pwr_w:
          type: integer
    Schedule:
      type: object
      required: [enabled, groups]
      properties:
        enabled:
          type: boolean
          description: Scheduler master flag (register 48000 r0).
        groups:
          type: array
          minItems: 8
          maxItems: 8
          items:
            $ref: '#/components/schemas/ScheduleGroup'
    ScheduleGroup:
      type: object
      required: [index, enabled, start, end, work_mode, max_soc_pct, min_soc_on_grid_pct, fd_soc_pct, fd_pwr_w]
      properties:
        index:
          type: integer
          minimum: 1
          maximum: 8
        enabled:
          type: boolean
        start:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          description: Window start, HH:MM.
        end:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          description: Window end, HH:MM. Must be after start.
        work_mode:
          $ref: '#/components/schemas/ScheduleWorkMode'
        max_soc_pct:
          type: integer
          minimum: 0
          maximum: 100
          description: Max SoC from grid. 10..100 on an enabled group.
        min_soc_on_grid_pct:
          type: integer
          minimum: 0
          maximum: 100
          description: Min SoC on grid. 10..100 on an enabled group.
        fd_soc_pct:
          type: integer
          minimum: 0
          maximum: 100
          description: >-
            Force-charge/force-discharge cut-off SOC. 10..100 on an enabled
            group.
        fd_pwr_w:
          type: integer
          format: int32
          minimum: 0
          maximum: 10500
          description: >-
            Force-charge/force-discharge power limit, watts. On a force-charge
            group, 0 means no charging from the grid (the FoxESS app's "charge
            from grid" off writes 0; on writes the power back).
        default:
          type: boolean
          readOnly: true
          description: >-
            The default group (GET only): the enabled 00:00–23:59 group, the
            FoxESS app's "remaining time" mode — what runs outside every other
            window.
        after_cutoff:
          type: string
          enum: [standby, self-use]
          readOnly: true
          description: >-
            GET only, force groups: the action once the group reaches its
            cut-off SoC (the group's +8 register; 1 standby, 3 self-use).
            Absent for other groups or an unknown value. PUT /schedule keeps it.
        import_limit_w:
          type: integer
          readOnly: true
          description: >-
            GET only: the group's grid import limit, W, from its parameter
            block (57000 + 50·(index−1); all eight are read, groups 6–8 at
            addresses extrapolated from groups 1–5). 99999 / 100000
            is the app's "no limit". Absent until read. PUT /schedule keeps it.
        export_limit_w:
          type: integer
          readOnly: true
          description: >-
            GET only: the group's grid export limit, W (as import_limit_w).
        pv:
          type: boolean
          readOnly: true
          description: >-
            GET only: whether the group charges (force charge) or discharges
            with solar. Absent until read. PUT /schedule keeps it.
    FrameDirection:
      type: string
      enum: [inverter-to-cloud, cloud-to-inverter]
    FrameType:
      type: string
      enum:
        - telemetry-150
        - keepalive-135
        - snap01
        - snap02
        - snap04
        - snap60
        - snap61
        - snap65
        - rssi
        - modbus-read
        - modbus-write
        - modbus-read-response
        - write-ack
        - registration
        - firmware-metadata
        - firmware-chunk
        - unknown
    AuditAction:
      type: string
      enum: [allow, drop]
    AuditEntry:
      type: object
      required: [ts, source, action, summary]
      properties:
        ts:
          type: string
          format: date-time
        source:
          type: string
          description: Token name for local commands; `cloud` for upstream-originated messages.
        source_role:
          type: [Role, 'null']
          description: Token role; null for cloud.
        action:
          $ref: '#/components/schemas/AuditAction'
        summary:
          type: string
          description: Human-readable operation (e.g. "work-mode feed-in (41000=1)", "upstream Modbus write dropped (mode telemetry_only)").
        confirmed:
          type: string
          enum: [yes, no, unknown, not-applicable]
          description: Whether the inverter confirmed (read-back) an allowed write.
    MessageEntry:
      type: object
      required: [ts, dir, frame, length, hex, device, fn]
      properties:
        ts:
          type: string
          format: date-time
        dir:
          $ref: '#/components/schemas/FrameDirection'
        frame:
          $ref: '#/components/schemas/FrameType'
        length:
          type: integer
          description: Payload bytes.
        hex:
          type: string
          description: The payload, hex.
        device:
          type: string
          pattern: '^[0-9a-f]{8}$'
          description: >-
            The frame header's four device bytes, hex. For session frames
            the last three are the sender's clock / 256 (the inverter's in
            local time, the cloud's in UTC).
        fn:
          type: integer
          minimum: 0
          maximum: 255
          description: The frame header's envelope function byte.
        summary:
          type: [string, 'null']
          description: >-
            Decoded summary where available: the class's structured decode as
            JSON. Unclassified frames with a known layout carry
            {"firmware_task": {component, mcu_type, filename, size, crc, url}}
            (a cloud firmware upgrade task; url is the file the dongle would
            download), {"firmware_push": {name, size, crc}} (an in-band
            firmware announcement) or {"json": …} (a JSON note).
        decision:
          type: string
          enum: [forwarded, dropped, injected, residue]
          description: >-
            What happened to the frame. `forwarded`: passed on (to the
            inverter for cloud frames; for inverter frames, to the cloud
            unless `reason` says it was kept from it). `dropped`: blocked by
            the policy (C-001). `injected`: written by this app.
            `residue`: a partial frame left when the connection closed.
        reason:
          type: [string, 'null']
          description: >-
            The policy verdict or routing note, e.g.
            `mode:telemetry_only read:…` (a cloud read relayed),
            `mode:telemetry_only deny:…` (blocked), or
            `answer to this app's request: kept from the cloud`.
        origin:
          type: [string, 'null']
          description: Who wrote an injected frame (gateway, bootstrap, trigread).
    MaintenanceState:
      type: object
      description: Maintenance window state (the null fields are set only while active)
      required: [active, remaining_s, rearms]
      properties:
        active:
          type: boolean
        opened_at:
          type: [string, 'null']
          format: date-time
        expires_at:
          type: [string, 'null']
          format: date-time
        remaining_s:
          type: integer
          description: Seconds until expiry (0 while inactive)
        rearms:
          type: integer
          description: Deadline re-arms since the window opened
        overridden_from:
          type: [string, 'null']
          description: The forward mode in force while the window is active
        capturing:
          type: boolean
          description: The window's traffic is being recorded (opened with `capture`)
    CaptureInfo:
      type: object
      required: [id, started, bytes, connections, capped, active, version]
      properties:
        id: {type: string, description: 'The window''s start, UTC (20261118T013500Z)'}
        started: {type: string, format: date-time}
        stopped: {type: string, format: date-time}
        bytes: {type: integer, description: Bytes recorded, both directions}
        connections: {type: integer}
        capped: {type: boolean, description: Recording stopped at the size cap}
        active: {type: boolean, description: Still recording}
        version: {type: string, description: The foxess-local build that recorded it}
    TokenInfo:
      type: object
      required: [id, name, role, created]
      properties:
        id:
          type: string
        name:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        created:
          type: string
          format: date-time
        last_used:
          type: [string, 'null']
          format: date-time
    TokenCreate:
      type: object
      required: [name, role]
      properties:
        name:
          type: string
          minLength: 1
          description: Unique display name (also the audit `source` identity).
        role:
          $ref: '#/components/schemas/Role'
    TokenCreated:
      type: object
      required: [token, id, name, role, created]
      properties:
        token:
          type: string
          description: Plaintext token; returned exactly once.
        id:
          type: string
        name:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        created:
          type: string
          format: date-time
    Config:
      type: object
      required: [raw_hours, bucket_days, version, public_access]
      properties:
        forward_mode:
          $ref: '#/components/schemas/ForwardMode'
        time_zone_name:
          type: [string, 'null']
          description: >-
            The host's IANA time-zone name (e.g. Australia/Sydney), from TZ,
            /etc/timezone or the /etc/localtime link; null when it cannot be
            told. Informational: the schedule runs on the inverter's clock,
            kept to `site_time_zone`.
        raw_hours:
          type: integer
          description: Dense raw telemetry retention (hours).
        bucket_days:
          type: integer
          description: 15-minute rollup retention (days).
        version:
          type: string
          description: Software version.
        public_access:
          type: boolean
          default: true
          description: >-
            Unauthenticated read-only access (config-file-only). Limited to
            the dashboard's endpoints (state, history, power/average, config,
            forward-mode, events) unless public_all_pages is true.
        public_all_pages:
          type: boolean
          default: false
          description: >-
            Unauthenticated sessions may also read the other pages'
            endpoints (config-file-only; needs public_access).
        issue_url:
          type: string
          description: >-
            Where to file a problem report (the release repository's
            new-issue page). Absent when no repository is known (a source
            build without `[update] repo`).
        time_zone:
          type: string
          description: >-
            This machine's own time zone (name and abbreviation, e.g.
            "Australia/Sydney (AEDT)"). Informational: the schedule and the
            inverter's clock follow `site_time_zone`.
        utc_offset_s:
          type: integer
          description: The host zone's current offset from UTC (seconds).
        site_time_zone:
          type: [string, 'null']
          description: The site's IANA zone (`site.time_zone`); null until chosen.
        inverter_clock_offset_s:
          type: number
          nullable: true
          description: >-
            The inverter's clock (0x9C40 ×6, read with the settings) minus
            the site zone's time at the last read, in seconds; positive when
            the inverter is ahead. Null before the first read or while no
            site zone is chosen.
    Settings:
      type: object
      required: [settings]
      properties:
        settings:
          type: array
          items:
            type: object
            required: [key, value, source]
            properties:
              key:
                type: string
                enum: [battery.capacity_wh, access.public_read_only, access.public_all_pages, forward.mode]
              value:
                description: integer (Wh) or null for battery.capacity_wh; boolean for the access keys; the mode name for forward.mode.
              source:
                type: string
                enum: [ui, config, default]
    Setup:
      type: object
      required: [completed, checks, battery]
      properties:
        completed: { type: boolean }
        checks:
          type: array
          items:
            type: object
            required: [id, title, status, detail]
            properties:
              id: { type: string, enum: [inverter_connected, identified, verified, clock, battery_capacity] }
              title: { type: string }
              status: { type: string, enum: [ok, warn, fail, pending] }
              detail: { type: string }
              fix: { type: string, description: 'What to do; present whenever status is not ok (except some pending checks, which only need time).' }
              action: { type: string, enum: [set_clock], description: 'A one-press remedy (installer): set_clock = POST /clock/set.' }
        battery:
          type: object
          properties:
            modules: { type: [integer, 'null'], description: 'Battery modules reported by the inverter; null until its module snapshot arrives.' }
            capacity_wh: { type: [integer, 'null'] }
    CurrentLimits:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        import_current_a: { type: number, minimum: 2, maximum: 100, description: 'Import current limit, A (0.1 A resolution).' }
        export_current_a: { type: number, minimum: 2, maximum: 100, description: 'Export current limit, A (0.1 A resolution).' }
    PortLimits:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        load_limit_w: { type: integer, minimum: 0, maximum: 65535, description: 'LoadLimitPower: max draw from the switchboard, W.' }
        generation_limit_w: { type: integer, minimum: 0, maximum: 65535, description: 'GenerationLimitPower: presumed max output, W.' }
    BatteryCurrents:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        max_charge_current_a: { type: number, minimum: 0, maximum: 50, description: 'Battery-side charge current limit, A (0.1 A resolution).' }
        max_discharge_current_a: { type: number, minimum: 0, maximum: 50, description: 'Battery-side discharge current limit, A (0.1 A resolution).' }
    PowerLimit:
      type: object
      required: [power_limit_pct]
      additionalProperties: false
      properties:
        power_limit_pct: { type: integer, minimum: 0, maximum: 100, description: 'Inverter output, % of rating.' }
    EpsModeRequest:
      type: object
      required: [eps_mode]
      additionalProperties: false
      properties:
        eps_mode: { type: string, enum: [ups, eps] }
    DeviceScanStatus:
      type: object
      required: [state, blocks_total, blocks_done, blocks_ok, blocks_failed]
      properties:
        state: { type: string, enum: [idle, running, done] }
        model: { type: string }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        blocks_total: { type: integer }
        blocks_done: { type: integer }
        blocks_ok: { type: integer }
        blocks_failed: { type: integer, description: 'Blocks the inverter refused (e.g. a Modbus exception for registers it does not have).' }
    History:
      type: object
      required: [range, step, ts, sol, grid, haus, batt, soc, totals]
      properties:
        range: { type: string, enum: [1h, 6h, 24h, 72h, 7d, 30d] }
        step: { type: string, enum: [1m, 5m, 15m, 1h] }
        ts:
          type: array
          items: { type: integer }
        sol:
          type: array
          items: { type: [integer, 'null'] }
        grid:
          type: array
          items: { type: [integer, 'null'] }
        haus:
          type: array
          description: Household load, W, mean per step — the EPS (backup) port included (see eps).
          items: { type: [integer, 'null'] }
        batt:
          type: array
          items: { type: [integer, 'null'] }
        soc:
          type: array
          items: { type: [integer, 'null'] }
        soc_est:
          type: array
          description: The SoC estimate (D-028), %, two decimals — the last one in each step. Anchored to the BMS's own 0.1 % SoC from the ~5-minute battery snapshot where the inverter sends one; null where none was stored (no battery capacity set, or before 2026-11-20).
          items: { type: [number, 'null'] }
        t_batt:
          type: array
          description: Battery temperature as the inverter reads it (register 31023), °C, mean per step. Null where no sample carried it (before 2026-11-18, and the cloud-era 150 B frame).
          items: { type: [number, 'null'] }
        t_inv:
          type: array
          description: Inverter temperature (31018), °C, mean per step.
          items: { type: [number, 'null'] }
        t_amb:
          type: array
          description: Ambient temperature at the inverter (31019), °C, mean per step.
          items: { type: [number, 'null'] }
        bms_chg_a:
          type: array
          description: The BMS's charge-current limit (31025), A, mean per step — set by the battery from its coldest cell's temperature and its SoC.
          items: { type: [number, 'null'] }
        t_cell_min:
          type: array
          description: The BMS's coldest cell temperature, °C, mean per step (the FoxESS portal's "BMS battery temperature"). From the battery snapshot the inverter pushes about every 5 minutes; null where none arrived in the previous 15 minutes.
          items: { type: [number, 'null'] }
        t_cell_max:
          type: array
          description: The BMS's warmest cell temperature, °C, mean per step (same source and nulls as t_cell_min).
          items: { type: [number, 'null'] }
        eps:
          type: array
          description: The EPS (backup) port's output, W, mean per step — the part of haus the backup circuits drew (haus includes it). Null where unknown (a step stored before 2026-11-19 whose raw samples are no longer kept).
          items: { type: [integer, 'null'] }
        totals:
          type: object
          required: [sol_wh, haus_wh, grid_import_wh, grid_export_wh, batt_charged_wh, batt_discharged_wh, stored_delta_wh]
          properties:
            sol_wh: { type: integer }
            haus_wh: { type: integer }
            grid_import_wh: { type: integer }
            grid_export_wh: { type: integer }
            batt_charged_wh: { type: integer }
            batt_discharged_wh: { type: integer }
            stored_delta_wh: { type: [integer, 'null'], description: 'SoC first→last × capacity_wh; null while the capacity is not set.' }
    Event:
      type: object
      description: One server-sent event. `event` selects the `data` payload (see `x-event-map`).
      required: [event, data]
      properties:
        id:
          type: integer
          description: >-
            Monotonic per connection epoch; send back as Last-Event-ID.
            Absent on a snapshot (not replayed).
        event:
          type: string
          enum: [snapshot, config, connection, system, resync, gap]
        data:
          $ref: '#/components/schemas/EventData'
      x-event-map:
        snapshot: SnapshotEvent
        config: ConfigEvent
        connection: ConnectionEvent
        system: SystemEvent
        resync: ResyncEvent
        gap: GapEvent
    EventData:
      description: One payload per event type (discriminated by the SSE `event` field).
      oneOf:
        - $ref: '#/components/schemas/SnapshotEvent'
        - $ref: '#/components/schemas/ConfigEvent'
        - $ref: '#/components/schemas/ConnectionEvent'
        - $ref: '#/components/schemas/SystemEvent'
        - $ref: '#/components/schemas/ResyncEvent'
        - $ref: '#/components/schemas/GapEvent'
    SnapshotEvent:
      type: object
      description: Every 150 B telemetry frame (~5 s) — the immediate sensor feed.
      required: [ts, power, soc_pct, battery_state]
      properties:
        energy:
          $ref: '#/components/schemas/Energy'
          description: The lifetime counters, in every snapshot once they have been read (absent before).
        ts:
          type: string
          format: date-time
        power:
          $ref: '#/components/schemas/Power'
        soc_pct:
          type: integer
          minimum: 0
          maximum: 100
        soc_estimate_pct:
          type: [number, 'null']
          minimum: 0
          maximum: 100
          description: As Battery.soc_estimate_pct (null while the capacity is not set).
        battery_state:
          $ref: '#/components/schemas/BatteryState'
    ConfigEvent:
      type: object
      description: >-
        Any confirmed register change: an own command, an observed cloud
        push, or a setting the periodic settings read found changed on the
        inverter itself (its panel); or `active-mode` alone, when the
        running mode (`state.active_mode`) changed with the time — a
        schedule window started or ended on the inverter's clock. `state`
        is the full new snapshot; the client diffs on `changed`.
      required: [changed, state]
      properties:
        changed:
          type: array
          minItems: 1
          items:
            type: string
            enum: [work-mode, limits, meter-compensation, schedule, forward-mode, identity, write-budget, active-mode]
        state:
          $ref: '#/components/schemas/State'
    ConnectionEvent:
      type: object
      required: [state]
      description: >-
        Liveness transition, server-computed: session down, or data-silent
        for >15 s (the same threshold as State.online).
      properties:
        state:
          type: string
          enum: [online, offline]
    SystemEvent:
      type: object
      required: [type, detail]
      properties:
        type:
          type: string
          enum: [forward-mode-changed, maintenance-opened, maintenance-extended, maintenance-expired, maintenance-closed, alert, gate-rule-loss, upgrade-rolled-back, grid-lost, grid-restored, unclean-restart, battery-low, battery-forecast-low, counter-reset, firmware-task, schedule-override-started, schedule-override-ended, notice]
        detail:
          type: string
    ResyncEvent:
      type: object
      description: Replay window exceeded. Do GET /state, then continue the stream.
    GapEvent:
      type: object
      description: Events were dropped for this client (queue overflow). Do GET /state.
      properties:
        missed:
          type: integer
          description: Number of events dropped.
    UpdateView:
      type: object
      required: [current, available, checks_enabled, can_apply]
      properties:
        current: { type: string, description: The running version. }
        latest: { type: string, description: "The newest eligible release (absent until a check): a prerelease only when prereleases are offered." }
        latest_prerelease: { type: boolean, description: latest is a prerelease. }
        url: { type: string, description: Its release notes. }
        available: { type: boolean, description: A newer release exists. }
        checked_at: { type: [string, 'null'], format: date-time }
        error: { type: string, description: The last check's failure. }
        checks_enabled: { type: boolean, description: Scheduled release checks are on (check_interval_h > 0). }
        check_interval_h: { type: integer, description: "Hours between scheduled checks (update.check_interval_h; default 168, a week; 0 = never)." }
        next_check_at: { type: [string, 'null'], format: date-time, description: When the next scheduled check is due. }
        prerelease: { type: boolean, description: "Prereleases (vX.Y.Z-rc.N) are offered (update.prerelease)." }
        auto_apply: { type: boolean, description: "Each new eligible release is applied once, on its own, when a scheduled check finds it (update.auto_apply). Not retried after a failure or a rollback." }
        can_apply: { type: boolean, description: Available and installable here. }
        reason: { type: string, description: Why it cannot be applied here. }
        reason_code: { type: string, enum: [container, source_build, no_key, no_repo, unavailable], description: "reason's stable code, for a UI to translate." }
        rolled_back: { $ref: '#/components/schemas/UpgradeMarker' }
        pending: { $ref: '#/components/schemas/UpgradeMarker' }
    UpgradeMarker:
      type: object
      description: An upgrade in flight (pending) or one the guard rolled back.
      properties:
        from: { type: string }
        to: { type: string }
        attempts: { type: integer, description: Starts the new version has had. }
        online_before: { type: boolean, description: The inverter was online when it was applied (the new version must bring it back). }
    Problem:
      type: object
      description: RFC 7807 problem details with stable machine-readable `code`.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          enum:
            - unauthorized
            - insufficient_role
            - not_found
            - invalid_value
            - schedule_overlap
            - command_in_flight
            - conflict
            - inverter_offline
            - command_failed
            - internal
            - write_unsupported
            - write_unverified
            - device_not_identified
            - checks_failing
            - write_budget
            - insufficient_space
            - maintenance_not_active
            - notify_not_configured
            - scan_running
            - scan_unavailable
            - settings_unavailable
            - too_many_streams
            - update_failed
            - update_not_available
            - update_not_possible
            - update_verification_failed
            - zone_mismatch
            - zone_unset
            - host_clock_unsynced
            - notice_rate
            - notices_unavailable
            - override_held
            - override_no_group
            - override_unavailable
            - schedule_unknown
            - wall_time_unknown
        setting:
          type: string
          description: Present on write_budget — the setting whose budget is spent (a `write_budget` key).
        remaining:
          type: integer
          description: Present on write_budget (always 0).
        next_free_at:
          type: string
          format: date-time
          description: Present on write_budget — when the next write to the setting is allowed.
        reason:
          type: string
          enum: [unmapped, not_supported]
          description: >-
            Present on write_unsupported: `unmapped` = no known register or
            encoding for this inverter; `not_supported` = the inverter
            lacks the feature.
        required_role:
          type: [Role, 'null']
          description: Present on insufficient_role.
        token_role:
          type: [Role, 'null']
          description: Present on insufficient_role.
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string
          description: Present on invalid_value.
        applied:
          type: string
          enum: [yes, no, unknown]
          description: Present on command_failed — whether the write landed.
