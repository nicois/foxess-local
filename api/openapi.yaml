        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InsufficientRole'
        '409':
          $ref: '#/components/responses/CommandInFlight'
        '501':
          $ref: '#/components/responses/WriteUnsupported'
        '503':
