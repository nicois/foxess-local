  /forward-mode:
    get:
      tags: [Forward]
      operationId: getForwardMode
      summary: Get cloud-forward mode
      x-required-role: read-only
      responses:
        '200':
          description: Current mode
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForwardModeState'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InsufficientRole'
    put:
      tags: [Forward]
      operationId: setForwardMode
      summary: Set cloud-forward mode
      description: |
        The forward-mode ladder: `off` (no cloud leg at all — the
        hook-generated frames only), `telemetry_only` (inverter→cloud
        mirrored; cloud→inverter only the cloud's Modbus read requests,
        which cannot change the inverter — every write is denied; each
        answer goes to whoever asked, so the app's own reads stay local),
        `full` (both directions: every kind of frame the cloud is known
        to send — session control, reads, writes — passes; anything else,
        a firmware push included, is held until a maintenance window is
        open; an explicit installer-gated audited opt-in). An active maintenance window overrides the mode while it
        lasts; this endpoint writes the persistent setting, which is in
        force on window expiry or close. The change applies at once: the
        mode is decided per connection, so the live session is closed at
        its next frame and the inverter reconnects under the new mode
        (a few seconds without live data; audited as `reconnect`).
      x-required-role: installer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForwardModeState'
      responses:
        '200':
          description: New mode
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForwardModeState'
        '400':
          $ref: '#/components/responses/InvalidValue'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InsufficientRole'
  /audit:
    get:
      tags: [Audit]
      operationId: listAudit
      summary: Policy and command decision log
      description: |
        Below the expert role the per-frame cloud decisions (source
        `cloud`: the cloud's Modbus requests, allowed or dropped) are left
        out and `cloud_hidden` is true; operator actions are always shown.
        Immutable log of every upstream-to-inverter decision and operator
        command: source (token name or `cloud`), action, and whether the
        inverter confirmed the write. Newest first; page with `before`.
      x-required-role: read-only
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - name: source
          in: query
          description: Token name, or `cloud`
          schema:
            type: string
        - name: action
          in: query
          schema:
            $ref: '#/components/schemas/AuditAction'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Before'
      responses:
        '200':
          description: Decision entries (newest first)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  cloud_hidden:
                    type: boolean
                    description: The per-frame cloud decisions were left out (a token below expert).
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InsufficientRole'
  /messages:
    get:
      tags: [Audit]
      operationId: listMessages
      summary: Raw frame log
      description: Both directions, all frames, with decoded summary where available. Power-user/debug view.
      x-required-role: expert
      parameters:
        - $ref: '#/components/parameters/From'
