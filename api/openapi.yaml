  /eps-mode:
    put:
      tags: [Commands]
      operationId: setEpsMode
      summary: Set the backup (EPS) port mode
      description: |
        Diagram marker 5, register 41015: `ups` (3) switches the backup
        circuits to the battery within milliseconds on a grid failure;
        `eps` (2) switches more slowly. The circuits on the port may lose
        power briefly during the change. `disabled` (presumed 1) has never
        been written on a verified device and is refused.
        **Write gate (C-008):** the inverter must be identified and the
        feature's register encoding trusted for it (`identity.writes` in
        `GET /state` names the support per feature). Refusals: `501
        write_unsupported`, `403 write_unverified` (an installer can grant
        untested writes, `PUT /write-override`), `409 checks_failing`,
        `503 device_not_identified`. Writes are rationed: the inverter's
        current value is read first and an unchanged one is not written;
        at most 10 real writes per setting per hour (`429 write_budget`).
      x-required-role: installer
