openapi: 3.1.0
info:
  title: foxesslocal API
  version: 1.0.0
  description: |
    Self-owned REST API for local control of a Foxess KH10 inverter
    (uplink intercepted at the egress gate; the frame service is the sole
    upstream-to-inverter path). Consumed by the foxess-control HA
    integration, the web UI, and scripts.

    ## Roles

    Authenticated with a named bearer token. Roles form an ordered hierarchy
    (`read-only < standard < expert < installer`); a token grants its level
    and everything below it. The minimum role each operation requires is
    declared in its `x-required-role` extension; a token below that level
    receives `403` with `code: insufficient_role` (carrying `required_role`
    and `token_role`).

    - **read-only** — all reads, including the event stream.
    - **standard** — battery management: work mode, scheduler.
    - **expert** — + meter compensation.
    - **installer** — + power limits, forward mode, maintenance window,
      token management.

    ## Events

    `GET /events` is a Server-Sent Events stream (`text/event-stream`).
    Browsers' `EventSource` cannot set headers; it may pass the bearer token
    as `?token=` (LAN-only v1). All other clients use the `Authorization`
    header. Send `Last-Event-ID` on (re)connect for replay.

    ## Errors

    RFC 7807 `application/problem+json` with a stable machine-readable `code`.
    Writes are synchronous and confirmed: the response carries the device's
    read-back value (rounding visible, e.g. export 4995 -> 5000). No read-back
    within the timeout yields `504 command_failed` with `applied: unknown`.
servers:
  - url: /api/v1
    description: >-
      The app that serves this document (it is at /api/v1/openapi.yaml on
      every install). Elsewhere: http://<the gateway host>:18080/api/v1 —
      the [server] http_listen port.
security:
  - bearerAuth: []
tags:
  - name: State
  - name: Commands
  - name: Forward
  - name: Audit
  - name: Maintenance
  - name: Config
  - name: Events
paths:
  /compatibility:
    get:
      tags: [State]
      operationId: getCompatibility
      summary: Per-feature confidence that the register meanings fit this inverter
      description: |
        Design D-020. Each feature (live values, settings read, work mode,
        power limits, current limits, meter compensation, schedule) is
        graded from the identified model / firmware and plausibility checks
        on the latest register reads: `exact` (verified profile, checks
        pass), `compatible` (same family and register layout, other
        firmware, checks pass), `pending` (not read yet), `unknown`
        (unrecognised device, or a check failed — the failing check is
        named). Reporting only: writes are not gated by it yet (C-008,
        design step 4).
      x-required-role: read-only
      responses:
        '200':
          description: The report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompatibilityReport'
  /state:
    get:
      tags: [State]
      operationId: getState
      summary: Normalized inverter snapshot
      description: |
        Full snapshot. `as_of` is the newest frame reflected. `power` and
        `battery.soc_pct`/`battery.state` update at the inverter's 5 s
        telemetry cadence (live register polls); `battery.stored_energy_wh`
        follows the SoC (SoC × `battery.capacity_wh`); `battery.pack_voltage_v`
        updates at the ~5 min snapshot-burst cadence and is `null` until the
        first burst. Config sections
        (`work_mode`, `meter_compensation_w`, `limits`, `schedule`) carry the
        newer of the last confirmed write (own or observed upstream) and the
        last register read (read at session start, then every 5 min). Before
        either exists they read 0 / disabled.
      x-required-role: read-only
      responses:
        '200':
          description: Snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/State'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InsufficientRole'
  /device-scan:
    post:
      tags: [State]
      operationId: startDeviceScan
      summary: Start a read-only register scan of the inverter
      description: |
        Reads, once, every register block the identified model's
        candidate foxess_modbus maps name (each map with its own read
        function, never an address the map marks invalid), after the
        identity blocks; an unidentified inverter gets the identity
        blocks only. Reads only — nothing is written. Reads are paced
        (250 ms apart) so the live values keep updating. A block the
        inverter refuses is recorded, not fatal. The finished scan joins
        the next problem report (`POST /report`, `register-scan.jsonl`,
        de-identified). Audited (`device-scan`).
      x-required-role: installer
      responses:
        '202':
          description: Started
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceScanStatus' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InsufficientRole'
        '409':
          description: A scan is already running (`scan_running`).
        '503':
          description: Scans are not offered by this server (`scan_unavailable`).
    get:
      tags: [State]
      operationId: getDeviceScan
      summary: The register scan's progress
      x-required-role: installer
      responses:
        '200':
          description: Progress
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceScanStatus' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InsufficientRole'
        '503':
          description: Scans are not offered by this server (`scan_unavailable`).
  /report:
    post:
      tags: [State]
      operationId: createProblemReport
      summary: Build a problem report (diagnostic bundle + description)
      description: |
        A problem report for the developers: the de-identified diagnostic
        bundle of the last `hours` (as `GET /bundle`) plus `report.json`
        — the tester's `description`, the app's facts (version, model,
        firmware, verification and write support, forward mode, settings,
        the setup checklist, data age, inverter clock offset) and the
        recent problem events from the audit log (errors, reconnects,
        commands, setting and update changes; times as seconds before
        the report, connection IDs renumbered, token names dropped).
        Serial numbers are pseudonymised everywhere, the description
        included; the export fails closed if one survives. Nothing is
        uploaded: the tester attaches the file to an issue
        (`GET /config` `issue_url`). Audited (`report-export`).
      x-required-role: installer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                description: { type: string, maxLength: 4000 }
                hours: { type: integer, minimum: 1, maximum: 168, default: 24 }
      responses:
        '200':
          description: The report archive (tar.gz), named foxess-report-<model>-fw<version>.tar.gz
          content:
            application/gzip:
              schema: { type: string, format: binary }
        '400':
          $ref: '#/components/responses/InvalidValue'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InsufficientRole'
  /bundle:
    get:
      tags: [State]
      operationId: getBundle
      summary: Download a de-identified diagnostic bundle (installer)
      description: |
        Design D-022. A tar.gz with manifest.json, compatibility.json,
        registers.csv (latest register reads) and frames.jsonl (every frame
        in the window, payload hex). Device serial numbers (inverter,
        datalogger, battery modules) are replaced by same-length pseudonyms,
        RTC read responses have their date zeroed, connection IDs are
        renumbered and dates shifted to 2000-01-01 (time of day kept); the
        archive is then scanned for every identifier in ASCII and hex and
        the export fails (500) on any hit. Nothing is uploaded. Audited.
      x-required-role: installer
      parameters:
        - name: hours
          in: query
          schema: {type: integer, minimum: 1, maximum: 168, default: 24}
      responses:
        '200':
          description: The archive.
          content:
            application/gzip:
              schema: {type: string, format: binary}
        '400':
          $ref: '#/components/responses/InvalidValue'
        '403':
          $ref: '#/components/responses/InsufficientRole'
  /write-override:
    get:
      tags: [Commands]
      operationId: getWriteOverride
      summary: Whether untested writes are enabled for this inverter
      x-required-role: read-only
      responses:
        '200':
          description: The current device and the installer's grant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WriteOverride'
    put:
      tags: [Commands]
      operationId: grantWriteOverride
      summary: Enable untested writes for this exact inverter (installer)
      description: |
        C-008 (amended 2026-11-16). Grants writes whose encoding exists but
        is unverified on this model / firmware, bound to the exact model
        and firmware identified now: any change of either makes the grant
        inapplicable (it no longer covers the device). It cannot enable an
        impossible write (`write_unsupported`) nor override failing checks.
        Audited. Requires `acknowledge_risk: true` — untested writes can
        misconfigure the inverter.
      x-required-role: installer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [acknowledge_risk]
              properties:
                acknowledge_risk:
                  type: boolean
                  const: true
      responses:
        '200':
          description: Granted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WriteOverride'
        '400':
          $ref: '#/components/responses/InvalidValue'
        '403':
          $ref: '#/components/responses/InsufficientRole'
        '409':
          description: The inverter is not identified yet (`device_not_identified`).
    delete:
      tags: [Commands]
      operationId: revokeWriteOverride
      summary: Revoke the grant (installer)
      x-required-role: installer
      responses:
        '204':
          description: Revoked (audited).
        '403':
          $ref: '#/components/responses/InsufficientRole'
  /history:
    get:
      tags: [State]
      operationId: getHistory
      summary: Bucketed historical series
      x-required-role: read-only
      description: |
        Power and SoC history over a fixed range. `ts` is dense over the
        window (unix seconds); value arrays carry `null` where no data
        exists (gaps are not interpolated). An empty range returns empty
        arrays. `totals` aggregate present data only; `stored_delta_wh`
        scales the SoC first→last delta by the usable capacity
        (`battery.capacity_wh`), and is null while the capacity is not set.
      parameters:
        - name: range
          in: query
          required: true
          schema: { type: string, enum: [1h, 6h, 24h, 72h, 7d, 30d] }
      responses:
        '200':
          description: Series
          content:
            application/json:
              schema: { $ref: '#/components/schemas/History' }
        '400': { $ref: '#/components/responses/InvalidValue' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientRole' }
  /power/average:
    get:
      tags: [State]
      operationId: getPowerAverage
      summary: Mean power over a trailing window
      description: |
        The mean of every live sample (5 s cadence) in the trailing window
        ending now — signed for grid / battery, so the net flow. `samples`
        vs `expected_samples` shows coverage; `power` is null when the
        window holds no samples. Same sign conventions as `State.power`.
      x-required-role: read-only
      parameters:
        - name: window
          in: query
          required: true
          schema: {type: string, enum: [5m, 15m, 30m, 1h]}
      responses:
        '200':
          description: The window average
          content:
            application/json:
              schema:
                type: object
                required: [window, from, to, samples, expected_samples, power]
                properties:
                  window: {type: string}
                  from: {type: string, format: date-time}
                  to: {type: string, format: date-time}
                  samples: {type: integer}
                  expected_samples: {type: integer}
                  power:
                    oneOf:
                      - $ref: '#/components/schemas/Power'
                      - type: 'null'
        '400':
          $ref: '#/components/responses/InvalidValue'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /work-mode:
    put:
      tags: [Commands]
      operationId: setWorkMode
      summary: Set immediate work mode
      description: |
        The two modes the inverter's immediate-mode register supports
        (force charge / force discharge are scheduler windows — use
        `PUT /schedule`). Synchronous: returns the confirmed read-back value.
        **Write gate (C-008):** the inverter must be identified and the
        feature's register encoding trusted for it. Refusals: `501
        write_unsupported` (`reason` unmapped / not_supported: impossible),
        `403 write_unverified` (untested on this model / firmware: an
        installer can grant it, `PUT /write-override`), `409
        checks_failing` (a plausibility check says the map looks wrong:
        not overridable), `503 device_not_identified` (retry once the
        identity reads land).
      x-required-role: standard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkModeRequest'
      responses:
        '429':
          $ref: '#/components/responses/TooManyWrites'
        '200':
          description: Confirmed value (read-back)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkModeRequest'
        '501':
          $ref: '#/components/responses/WriteUnsupported'
        '400':
          $ref: '#/components/responses/InvalidValue'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InsufficientRole'
        '409':
          $ref: '#/components/responses/CommandInFlight'
        '503':
          $ref: '#/components/responses/InverterOffline'
        '504':
          $ref: '#/components/responses/CommandFailed'
  /schedule:
    put:
      tags: [Commands]
      operationId: setSchedule
      summary: Replace the 8-group schedule table
      description: |
        Full-table replace (read via `GET /state`). Validation: overlapping
        enabled windows -> `400 schedule_overlap`; `end <= start` ->
        `400 invalid_value`; an enabled group's SoC fields outside 10..100
        or `fd_pwr_w` outside 0..10500 -> `400 invalid_value` (the
        installer's ranges). A disabled group's values are not checked: it
        is written the way the cloud writes an unused group (00:00-00:00,
        self-use, max/min SoC 100/10, fd SoC 10, fd power 0), and the
        read-back shows that. The gateway replicates the device's full read-modify-write
        push including mirror blocks; that is an internal detail.
        **Write gate (C-008):** the inverter must be identified and the
        feature's register encoding trusted for it. Refusals: `501
        write_unsupported` (`reason` unmapped / not_supported: impossible),
        `403 write_unverified` (untested on this model / firmware: an
        installer can grant it, `PUT /write-override`), `409
        checks_failing` (a plausibility check says the map looks wrong:
        not overridable), `503 device_not_identified` (retry once the
        identity reads land).
      x-required-role: standard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Schedule'
      responses:
        '429':
          $ref: '#/components/responses/TooManyWrites'
        '200':
          description: Confirmed table (read-back)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
        '501':
          $ref: '#/components/responses/WriteUnsupported'
        '400':
          $ref: '#/components/responses/InvalidValue'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InsufficientRole'
        '409':
          $ref: '#/components/responses/CommandInFlight'
        '503':
          $ref: '#/components/responses/InverterOffline'
        '504':
          $ref: '#/components/responses/CommandFailed'
  /schedule/override:
    get:
      tags: [Commands]
      operationId: getScheduleOverride
      summary: The active schedule override
      x-required-role: read-only
      responses:
        '200':
          description: The override (`active` false when none)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleOverride'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Commands]
      operationId: setScheduleOverride
      summary: Force charge or discharge until a time (start or renew)
      description: |
        For automations (D-029): a force discharge or force charge from
        now until `until`, without editing the schedule table. foxess-local
        puts the window in the lowest free schedule group that runs before
        the groups around it (the owner's groups never move: each group's
        parameter block belongs to its slot), cuts it short where another
        group's window begins inside it, and clears the group again at
        its end, on DELETE, or after a restart. The inverter stops at the
        cut-off SoC itself.

        One override at a time, held by the token that started it: the
        holder renews it by sending the same request with a later
        `until` (a renewal keeps the group and start and moves the end),
        or changes it. Another token gets `409 override_held`. Each start,
        renewal and end is one schedule write against the schedule's
        write budget (`429 write_budget`); a request the inverter already
        holds is not written. Not queued: with no inverter session it is
        `503 inverter_offline` and nothing is written.

        Refusals: `409 override_no_group` (no free group runs before the
        groups around the window), `409 override_unavailable` (the
        scheduler is off, the current table does not validate, the
        inverter's day ends now, or another window begins now), `503
        wall_time_unknown` (no inverter clock reading or site time zone),
        `503 schedule_unknown` (the schedule has not been read yet), and
        the write gate's refusals (as `PUT /schedule`).
      x-required-role: standard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleOverrideRequest'
      responses:
        '200':
          description: The override as written (read back)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleOverride'
        '400':
          $ref: '#/components/responses/InvalidValue'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InsufficientRole'
        '409':
          description: Held by another token, no group, or unavailable (`override_held`, `override_no_group`, `override_unavailable`, `command_in_flight`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyWrites'
        '501':
          $ref: '#/components/responses/WriteUnsupported'
        '502':
          $ref: '#/components/responses/CommandFailed'
        '503':
          $ref: '#/components/responses/InverterOffline'
        '504':
          $ref: '#/components/responses/CommandFailed'
    delete:
      tags: [Commands]
      operationId: clearScheduleOverride
      summary: End the schedule override now
      description: >-
        The holder, an expert or an installer ends it: its group is
        cleared (one schedule write). A group someone else has changed
        since is left as it is. Without an override it is a no-op. A
        failed write keeps the override; it is cleared at its end.
      x-required-role: standard
      responses:
        '200':
          description: Ended (`active` false)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleOverride'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 'Not the holder (`override_held`), or the role is too low'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          $ref: '#/components/responses/CommandInFlight'
        '429':
          $ref: '#/components/responses/TooManyWrites'
        '502':
          $ref: '#/components/responses/CommandFailed'
        '503':
          $ref: '#/components/responses/InverterOffline'
        '504':
          $ref: '#/components/responses/CommandFailed'
  /meter-compensation:
    put:
      tags: [Commands]
      operationId: setMeterCompensation
      summary: Set meter compensation
      description: |
        Signed watts, -500..500. Synchronous: returns the confirmed read-back value.

        **Write gate (C-008):** the inverter must be identified and the
        feature's register encoding trusted for it. Refusals: `501
        write_unsupported` (`reason` unmapped / not_supported: impossible),
        `403 write_unverified` (untested on this model / firmware: an
        installer can grant it, `PUT /write-override`), `409
        checks_failing` (a plausibility check says the map looks wrong:
        not overridable), `503 device_not_identified` (retry once the
        identity reads land).
      x-required-role: expert
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeterCompensationRequest'
      responses:
        '429':
          $ref: '#/components/responses/TooManyWrites'
        '200':
          description: Confirmed value (read-back)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeterCompensationRequest'
        '501':
          $ref: '#/components/responses/WriteUnsupported'
        '400':
          $ref: '#/components/responses/InvalidValue'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InsufficientRole'
        '409':
          $ref: '#/components/responses/CommandInFlight'
        '503':
          $ref: '#/components/responses/InverterOffline'
        '504':
          $ref: '#/components/responses/CommandFailed'
  /current-limits:
    put:
      tags: [Commands]
      operationId: setCurrentLimits
      summary: Set the grid import / export current limits
      description: |
        The current limits at the grid connection (diagram marker 1),
        registers 41027 / 41028 in 0.1 A. Partial updates; at least one
        field. Amps are rounded to 0.1 A.
        **Write gate (C-008):** the inverter must be identified and the
        feature's register encoding trusted for it (`identity.writes` in
        `GET /state` names the support per feature). Refusals: `501
        write_unsupported`, `403 write_unverified` (an installer can grant
        untested writes, `PUT /write-override`), `409 checks_failing`,
        `503 device_not_identified`. Writes are rationed: the inverter's
        current value is read first and an unchanged one is not written;
        at most 10 real writes per setting per hour (`429 write_budget`).
      x-required-role: installer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CurrentLimits'
      responses:
        '429':
          $ref: '#/components/responses/TooManyWrites'
        '200':
          description: The values as set (confirmed by the inverter's echo)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentLimits'
        '400':
          $ref: '#/components/responses/InvalidValue'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InsufficientRole'
        '409':
          $ref: '#/components/responses/CommandInFlight'
        '501':
          $ref: '#/components/responses/WriteUnsupported'
        '503':
          $ref: '#/components/responses/InverterOffline'
        '504':
          $ref: '#/components/responses/CommandFailed'
  /port-limits:
    put:
      tags: [Commands]
      operationId: setPortLimits
      summary: Set the inverter grid-port load / generation limits
      description: |
        The inverter's grid port (diagram marker 2): `load_limit_w`
        (LoadLimitPower, 41200) caps what the inverter draws from the
        switchboard — battery charging plus backup pass-through combined
        (measured 2026-11-17); `generation_limit_w` (GenerationLimitPower,
        41201) is presumed to cap its output (untested). Partial updates;
        at least one field.
        **Write gate (C-008):** the inverter must be identified and the
        feature's register encoding trusted for it (`identity.writes` in
        `GET /state` names the support per feature). Refusals: `501
        write_unsupported`, `403 write_unverified` (an installer can grant
        untested writes, `PUT /write-override`), `409 checks_failing`,
        `503 device_not_identified`. Writes are rationed: the inverter's
        current value is read first and an unchanged one is not written;
        at most 10 real writes per setting per hour (`429 write_budget`).
      x-required-role: installer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PortLimits'
      responses:
        '429':
          $ref: '#/components/responses/TooManyWrites'
        '200':
          description: The values as set (confirmed by the inverter's echo)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortLimits'
        '400':
          $ref: '#/components/responses/InvalidValue'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InsufficientRole'
        '409':
          $ref: '#/components/responses/CommandInFlight'
        '501':
          $ref: '#/components/responses/WriteUnsupported'
        '503':
          $ref: '#/components/responses/InverterOffline'
        '504':
          $ref: '#/components/responses/CommandFailed'
  /battery-currents:
    put:
      tags: [Commands]
      operationId: setBatteryCurrents
      summary: Set the max battery charge / discharge current
      description: |
        Battery-side (DC) current limits (diagram marker 3), registers
        41007 / 41008 in 0.1 A. Partial updates; at least one field.
        **Write gate (C-008):** the inverter must be identified and the
        feature's register encoding trusted for it (`identity.writes` in
        `GET /state` names the support per feature). Refusals: `501
        write_unsupported`, `403 write_unverified` (an installer can grant
        untested writes, `PUT /write-override`), `409 checks_failing`,
        `503 device_not_identified`. Writes are rationed: the inverter's
        current value is read first and an unchanged one is not written;
        at most 10 real writes per setting per hour (`429 write_budget`).
