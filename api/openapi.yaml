        '501':
          $ref: '#/components/responses/WriteUnsupported'
        '400':
          $ref: '#/components/responses/InvalidValue'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InsufficientRole'
        '409':
          $ref: '#/components/responses/CommandInFlight'
        '503':
          $ref: '#/components/responses/InverterOffline'
        '504':
          $ref: '#/components/responses/CommandFailed'
  /registers/read:
    post:
      tags: [Commands]
      operationId: readRegisters
      summary: Read a raw Modbus register block (installer probe)
      description: |
        Reads one block through the command gateway — fn 3 (holding) or
        4 (input), 1..125 registers — and returns the device's values in
        address order. Writes nothing. An unsupported register answers
        with a Modbus exception, reported as 502 command_failed with the
        exception code in the detail. Audited like every command.
      x-required-role: installer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterReadRequest'
      responses:
        '200':
          description: The device's register values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterReadResponse'
        '400':
          $ref: '#/components/responses/InvalidValue'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
