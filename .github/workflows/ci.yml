# Checks on every push / pull request (prox is a public module since
# 2026-11-17, so a runner can fetch every dependency).
# Actions are pinned to commit SHAs (update a SHA and its tag comment together).
name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      # the race detector over the whole suite (the gate tests load nft
      # rules in an unprivileged namespace, or skip where the runner
      # does not allow one)
      - run: sudo apt-get install -y nftables
      - run: go test -race ./...
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      # exactly the commit hooks, at the revs pinned in
      # .pre-commit-config.yaml (golangci-lint, shellcheck, the generated
      # installer) — one place to update: `prek autoupdate`
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/prek
          key: prek-${{ hashFiles('.pre-commit-config.yaml', 'go.mod') }}
      - run: pipx install prek==0.4.4
      - run: prek run --all-files --show-diff-on-failure
  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
