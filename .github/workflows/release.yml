# Builds a release on a version tag and opens an UNSIGNED draft (design
# D-023, RELEASING.md), with the tag's CHANGELOG.md section as its notes.
# CI never holds the signing key: the owner checks
# the draft by rebuilding it (the builds are reproducible), signs
# SHA256SUMS locally with minisign, uploads the .minisig and publishes.
# Actions are pinned to commit SHAs (update the SHA and its tag comment together).
name: release
on:
  push:
    tags: ["v*.*.*"] # releases and prereleases (vX.Y.Z-rc.N)
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      # the notes are the tag's CHANGELOG.md section (make tag writes it):
      # a tag without one fails here, before any build or draft
      # a prerelease (vX.Y.Z-rc.N) has no section of its own: its notes
      # are what is Unreleased at the tagged commit
      - name: changelog section
        run: |
          section="${GITHUB_REF_NAME}"
          case "${GITHUB_REF_NAME}" in *-*) section=Unreleased ;; esac
          go run ./tools/changelog notes -version "$section" >changes.md
      - run: go test ./...
      - run: make release VERSION="${GITHUB_REF_NAME}" REPO="${GITHUB_REPOSITORY}"
      - name: draft release (unsigned)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          key="$(sed -n 2p deploy/release-key.pub)"
          cp changes.md notes.md
          cat >>notes.md <<EOF

          ## Verify the download

          With minisign (INSTALL.md, step 2) and this release's signing key:

              minisign -Vm SHA256SUMS -P ${key}
              sha256sum -c --ignore-missing SHA256SUMS

          <!-- owner: rebuild and compare (make release), sign (make sign), upload SHA256SUMS.minisig, edit the notes, publish -->
          EOF
          # the release files by name: dist/ also holds the empty signature
          # placeholder (make release), which GitHub refuses to upload
          pre=""
          case "${GITHUB_REF_NAME}" in *-*) pre=--prerelease ;; esac
          gh release create "${GITHUB_REF_NAME}" --draft $pre --title "${GITHUB_REF_NAME}" \
            --notes-file notes.md dist/foxess-local_linux_* dist/foxess-wizard_linux_* dist/installer.sh dist/provision-openstick.sh dist/SHA256SUMS
